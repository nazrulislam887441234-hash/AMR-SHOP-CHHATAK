<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMR SHOP - Luxury Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Hind Siliguri', sans-serif; 
            background: #f1f5f9;
            touch-action: manipulation;
        }
        .swiper-pagination-bullet-active { background: #2563eb !important; width: 20px; border-radius: 5px; }
        .variant-btn.active { border-color: #2563eb; background: #eff6ff; color: #2563eb; transform: scale(1.05); }
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .product-container { max-width: 1000px; margin: 0 auto; }
        .desc-box {
            line-height: 1.8;
            word-spacing: 1px;
            color: #475569;
        }
        button, input { font-size: 16px !important; }
    </style>
</head>
<body class="pb-28">

    <nav class="glass-header sticky top-0 z-[100]">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <button onclick="history.back()" class="p-2.5 bg-white shadow-sm border border-slate-200 rounded-2xl hover:bg-slate-50 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" /></svg>
            </button>
            <h1 class="font-bold text-slate-800 text-lg tracking-tight">পণ্য বিবরণী</h1>
            <div class="relative cursor-pointer group" onclick="location.href='cart.html'">
                <div class="p-2.5 bg-blue-600 rounded-2xl text-white shadow-lg shadow-blue-200 group-active:scale-90 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
                </div>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full border-2 border-white font-bold animate-bounce">0</span>
            </div>
        </div>
    </nav>

    <div class="product-container">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:p-8">
            
            <div class="relative">
                <div class="swiper productSwiper w-full h-[400px] lg:h-[550px] lg:rounded-[2.5rem] bg-white shadow-sm">
                    <div class="swiper-wrapper" id="image-wrapper">
                        <div class="swiper-slide bg-slate-200 animate-pulse"></div>
                    </div>
                    <div class="swiper-pagination"></div>
                </div>
            </div>

            <div class="p-6 lg:p-0 space-y-8">
                <div class="space-y-4">
                    <div class="flex items-center gap-4">
                        <span id="p-price" class="text-4xl font-black text-blue-600">৳০</span>
                        <div class="flex flex-col">
                            <span id="p-old-price" class="text-slate-400 line-through text-sm">৳০</span>
                            <span id="p-save" class="bg-green-100 text-green-700 text-xs font-bold px-2 py-0.5 rounded-full">সাশ্রয় ৳০</span>
                        </div>
                    </div>
                    <h2 id="p-title" class="text-2xl lg:text-3xl font-bold text-slate-900 leading-tight">লোড হচ্ছে...</h2>
                </div>

                <div id="color-section" class="hidden space-y-4 bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest">কালার অপশন</h3>
                    <div id="color-list" class="flex flex-wrap gap-3"></div>
                </div>

                <div id="size-section" class="hidden space-y-4 bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest">সাইজ অপশন</h3>
                    <div id="size-list" class="flex flex-wrap gap-3"></div>
                </div>

                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2 border-b pb-3">
                        <span class="w-1.5 h-6 bg-blue-600 rounded-full"></span>
                        বিস্তারিত তথ্য
                    </h3>
                    <div id="p-desc" class="desc-box text-sm whitespace-pre-line"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-xl border-t border-slate-200 p-4 z-[100]">
        <div class="max-w-5xl mx-auto flex gap-4">
            <button onclick="addToCart()" class="flex-1 py-4 bg-slate-100 text-slate-800 font-bold rounded-2xl active:scale-95 transition-all flex items-center justify-center gap-2 hover:bg-slate-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                কার্টে রাখুন
            </button>
            <button onclick="buyNow()" class="flex-[2] py-4 bg-blue-600 text-white font-bold rounded-2xl shadow-xl shadow-blue-200 active:scale-95 transition-all hover:bg-blue-700">
                অর্ডার করুন 
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCTl215ewyVmGvbMcdO0jiRB1J5pL2mbL4",
            authDomain: "amrshopchhatak.firebaseapp.com",
            projectId: "amrshopchhatak",
            storageBucket: "amrshopchhatak.firebasestorage.app",
            messagingSenderId: "784648928211",
            appId: "1:784648928211:web:caa0b9a5713f95be330d26"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        let currentProduct = null;
        let basePrice = 0;
        let selectedColorPrice = 0;
        let selectedSizePrice = 0;
        let selectedColor = "";
        let selectedSize = "";

        async function loadProduct() {
            if (!productId) return;
            const docRef = doc(db, "products", productId);
            const snap = await getDoc(docRef);

            if (snap.exists()) {
                currentProduct = snap.data();
                basePrice = currentProduct.price;
                
                document.getElementById('p-title').innerText = currentProduct.name;
                document.getElementById('p-desc').innerText = currentProduct.description || "এই পণ্যটি সম্পর্কে কোনো বিস্তারিত তথ্য নেই।";
                document.getElementById('p-old-price').innerText = `৳${currentProduct.oldPrice || 0}`;
                updatePriceDisplay();

                const wrapper = document.getElementById('image-wrapper');
                wrapper.innerHTML = ""; 
                currentProduct.images.forEach(img => {
                    wrapper.innerHTML += `<div class="swiper-slide"><img src="${img}" class="w-full h-full object-contain lg:object-cover"></div>`;
                });
                new Swiper(".productSwiper", { 
                    pagination: { el: ".swiper-pagination", clickable: true }, 
                    loop: true,
                    grabCursor: true
                });

                renderVariants('color', currentProduct.colors);
                renderVariants('size', currentProduct.sizes);
            }
        }

        function renderVariants(type, list) {
            if (!list || list.length === 0) return;
            document.getElementById(`${type}-section`).classList.remove('hidden');
            const container = document.getElementById(`${type}-list`);
            list.forEach(v => {
                const btn = document.createElement('button');
                btn.className = "variant-btn bg-slate-50 border-2 border-slate-100 px-5 py-2.5 rounded-2xl text-[15px] font-bold transition-all shadow-sm";
                btn.innerText = v.extra > 0 ? `${v.name} (+৳${v.extra})` : v.name;
                btn.onclick = () => {
                    container.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    if(type === 'color') { selectedColorPrice = v.extra; selectedColor = v.name; }
                    else { selectedSizePrice = v.extra; selectedSize = v.name; }
                    updatePriceDisplay();
                };
                container.appendChild(btn);
            });
        }

        function updatePriceDisplay() {
            const total = basePrice + selectedColorPrice + selectedSizePrice;
            document.getElementById('p-price').innerText = `৳${total}`;
            const save = (currentProduct.oldPrice || 0) - total;
            document.getElementById('p-save').innerText = save > 0 ? `সাশ্রয় ৳${save}` : `বেস্ট প্রাইস`;
        }

        window.addToCart = () => {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const finalPrice = basePrice + selectedColorPrice + selectedSizePrice;
            const item = { id: productId, name: currentProduct.name, price: finalPrice, img: currentProduct.images[0], color: selectedColor, size: selectedSize, qty: 1 };
            cart.push(item);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            alert("কার্টে যোগ করা হয়েছে!");
        };

        window.buyNow = () => {
            if (!currentProduct) return;
            const finalPrice = basePrice + selectedColorPrice + selectedSizePrice;
            
            // সরাসরি এই প্রোডাক্টটি কার্টে ঢুকিয়ে দেওয়া হচ্ছে যাতে চেকআউটে পাওয়া যায়
            let singleCart = [{ id: productId, name: currentProduct.name, price: finalPrice, img: currentProduct.images[0], color: selectedColor, size: selectedSize, qty: 1 }];
            localStorage.setItem('cart', JSON.stringify(singleCart));
            
            // ইউআরএল এর মাধ্যমে তথ্য পাঠানো
            const checkoutUrl = `checkout.html?id=${productId}&price=${finalPrice}&color=${encodeURIComponent(selectedColor)}&size=${encodeURIComponent(selectedSize)}`;
            window.location.href = checkoutUrl;
        };

        function updateCartCount() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            document.getElementById('cart-count').innerText = cart.length;
        }

        loadProduct();
        updateCartCount();
    </script>
</body>
</html>
