<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMR SHOP CHHATAK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f8fafc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .product-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:hover { transform: translateY(-5px); }
        .glass-nav { background: rgba(37, 99, 235, 0.95); backdrop-filter: blur(12px); }
        
        /* Banner Sharp Edge Fix */
        .swiper { width: 100%; aspect-ratio: 16 / 9; border-radius: 0 !important; overflow: hidden; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover; border-radius: 0; }

        .shimmer { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        
        #sidebar { transition: transform 0.3s ease-in-out; transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }

        /* Prevent Layout Shift */
        #p-grid, #pinned-grid { min-height: 200px; }
    </style>
</head>
<body class="pb-24">

    <div id="overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/50 z-[60] hidden"></div>

    <div id="sidebar" class="fixed top-0 left-0 h-full w-72 bg-white z-[70] shadow-2xl p-6 overflow-y-auto">
        <h2 class="text-xl font-bold text-blue-600 mb-6">Social Networks</h2>
        <div id="social-links-list" class="space-y-4">
            <p class="text-gray-400 text-sm">লোডিং...</p>
        </div>
    </div>

    <div class="glass-nav p-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-[1400px] mx-auto flex items-center justify-between gap-4">
            <button onclick="toggleMenu()" class="text-white p-2">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>

            <h1 class="text-xl md:text-2xl font-extrabold text-white flex-1 text-center md:text-left">AMR <span class="text-yellow-400">SHOP</span></h1>
            
            <div class="hidden md:block relative flex-1 max-w-xl mx-4">
                <input type="text" id="search" oninput="searchProduct(this.value)" placeholder="নাম বা কিওয়ার্ড..." class="w-full p-3 pl-12 rounded-2xl outline-none text-sm border-none">
            </div>

            <a href="support.html" class="bg-white/20 p-2 rounded-xl text-white">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            </a>
        </div>
        <div class="md:hidden mt-3 relative px-2">
            <input type="text" id="searchMobile" oninput="searchProduct(this.value)" placeholder="পণ্য খুঁজুন..." class="w-full p-3 pl-12 rounded-xl outline-none text-sm border-none shadow-inner">
        </div>
    </div>

    <div class="max-w-[1400px] mx-auto mt-6">
        <div class="swiper mySwiper shadow-xl bg-gray-200">
            <div class="swiper-wrapper" id="banner-wrap">
                <div class="swiper-slide shimmer"></div>
            </div>
            <div class="swiper-pagination"></div>
        </div>
    </div>

    <div class="max-w-[1400px] mx-auto px-4 mt-6 flex gap-3">
        <a href="privacy-policy.html" class="flex-1 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 text-center text-xs font-bold text-slate-600 hover:bg-slate-50">Privacy Policy</a>
        <a href="termsandcondition.html" class="flex-1 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 text-center text-xs font-bold text-slate-600 hover:bg-slate-50">Terms & Condition</a>
    </div>

    <div class="fixed bottom-6 left-0 right-0 z-50 flex justify-center">
        <a href="status.html" class="bg-blue-600 text-white px-8 py-4 rounded-full font-bold shadow-2xl shadow-blue-400 flex items-center gap-3 active:scale-95 transition-transform">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
            অর্ডার ট্র্যাকিং ও হিস্ট্রি
        </a>
    </div>

    <div id="top-products-section" class="hidden max-w-[1400px] mx-auto px-4 mt-10">
        <div class="flex items-center gap-3 mb-6">
            <span class="w-2 h-8 bg-yellow-400 rounded-full"></span>
            <h2 class="text-2xl font-bold text-slate-800 tracking-tight">TOP PRODUCTS 📌</h2>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-4 lg:gap-6" id="pinned-grid"></div>
    </div>

    <div class="max-w-[1400px] mx-auto p-4 mt-6">
        <div id="cat-tabs" class="flex gap-3 overflow-x-auto pb-2 no-scrollbar">
            <button onclick="filterCat('all', this)" id="btn-all" class="bg-blue-600 text-white px-8 py-3 rounded-2xl text-sm font-bold shrink-0 shadow-lg">সব পণ্য</button>
        </div>
    </div>

    <div class="max-w-[1400px] mx-auto px-4">
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-4 lg:gap-6" id="p-grid">
            <div class="shimmer h-64 rounded-3xl"></div>
            <div class="shimmer h-64 rounded-3xl"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCTl215ewyVmGvbMcdO0jiRB1J5pL2mbL4",
            authDomain: "amrshopchhatak.firebaseapp.com",
            projectId: "amrshopchhatak",
            storageBucket: "amrshopchhatak.firebasestorage.app",
            messagingSenderId: "784648928211",
            appId: "1:784648928211:web:caa0b9a5713f95be330d26"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let allProducts = [];

        window.toggleMenu = () => {
            const side = document.getElementById('sidebar');
            const over = document.getElementById('overlay');
            side.classList.toggle('open');
            over.classList.toggle('hidden');
        };

        onSnapshot(collection(db, "socials"), (snap) => {
            const list = document.getElementById('social-links-list');
            list.innerHTML = "";
            snap.forEach(doc => {
                const s = doc.data();
                list.innerHTML += `
                    <a href="${s.url}" target="_blank" class="flex items-center gap-4 p-4 bg-slate-50 rounded-2xl hover:bg-blue-50 transition-colors">
                        <img src="${s.icon}" class="w-8 h-8 object-contain">
                        <span class="font-bold text-slate-700 text-sm">${s.name}</span>
                    </a>
                `;
            });
        });

        async function loadBanners() {
            const bSnap = await getDocs(collection(db, "banners"));
            const wrap = document.getElementById('banner-wrap');
            wrap.innerHTML = "";
            if(bSnap.empty) {
                wrap.innerHTML = `<div class="swiper-slide bg-blue-600 flex items-center justify-center text-white font-bold">Welcome</div>`;
            } else {
                bSnap.forEach(d => {
                    wrap.innerHTML += `<div class="swiper-slide"><img src="${d.data().url}" class="w-full h-full object-cover"></div>`;
                });
            }
            new Swiper(".mySwiper", { 
                autoplay: { delay: 4000 }, 
                loop: true, 
                pagination: { el: ".swiper-pagination", clickable: true }
            });
        }

        async function loadProducts() {
            const q = query(collection(db, "products"), orderBy("time", "desc"));
            onSnapshot(q, (pSnap) => {
                allProducts = pSnap.docs.map(doc => ({id: doc.id, ...doc.data()}));
                
                const pinned = allProducts.filter(p => p.isPinned === true);
                if(pinned.length > 0) {
                    document.getElementById('top-products-section').classList.remove('hidden');
                    render(pinned, 'pinned-grid');
                } else {
                    document.getElementById('top-products-section').classList.add('hidden');
                }
                render(allProducts, 'p-grid');
                renderCats();
            });
        }

        function render(items, targetId) {
            const grid = document.getElementById(targetId);
            grid.innerHTML = items.length ? "" : "<p class='col-span-full text-center text-gray-400 py-10'>পণ্য পাওয়া যায়নি</p>";
            items.forEach(p => {
                grid.innerHTML += `
                <div onclick="location.href='product.html?id=${p.id}'" class="product-card group bg-white rounded-3xl shadow-md border border-slate-100 overflow-hidden cursor-pointer relative">
                    <img src="${p.images[0]}" class="w-full aspect-square object-cover group-hover:scale-105 transition-transform" loading="lazy">
                    <div class="p-4">
                        <h3 class="text-sm font-bold text-slate-800 truncate">${p.name}</h3>
                        <p class="text-blue-600 font-bold text-lg">৳${p.price}</p>
                    </div>
                </div>`;
            });
        }

        function renderCats() {
            const cats = [...new Set(allProducts.map(p => p.category))].filter(Boolean);
            const tabContainer = document.getElementById('cat-tabs');
            const currentCats = Array.from(tabContainer.querySelectorAll('button')).map(b => b.innerText);
            
            cats.forEach(c => {
                if(!currentCats.includes(c)) {
                    const btn = document.createElement('button');
                    btn.className = "bg-white text-gray-500 px-8 py-3 rounded-2xl text-sm font-bold shrink-0 border border-slate-100 transition-all";
                    btn.innerText = c;
                    btn.onclick = (e) => filterCat(c, e.target);
                    tabContainer.appendChild(btn);
                }
            });
        }

        window.filterCat = (cat, btn) => {
            document.querySelectorAll('#cat-tabs button').forEach(b => {
                b.className = "bg-white text-gray-500 px-8 py-3 rounded-2xl text-sm font-bold shrink-0 border border-slate-100";
            });
            btn.className = "bg-blue-600 text-white px-8 py-3 rounded-2xl text-sm font-bold shrink-0 shadow-lg shadow-blue-200";
            render(cat === 'all' ? allProducts : allProducts.filter(p => p.category === cat), 'p-grid');
        };

        window.searchProduct = (val) => {
            const queryText = val.toLowerCase().trim();
            if(!queryText) {
                render(allProducts, 'p-grid');
                return;
            }
            const filtered = allProducts.filter(p => {
                const nameMatch = p.name ? p.name.toLowerCase().includes(queryText) : false;
                const catMatch = p.category ? p.category.toLowerCase().includes(queryText) : false;
                const keywordMatch = p.keywords ? p.keywords.some(k => k.toLowerCase().includes(queryText)) : false;
                return nameMatch || catMatch || keywordMatch;
            });
            render(filtered, 'p-grid');
        };

        // Run functions immediately to prevent layout pop
        loadBanners();
        loadProducts();
    </script>
</body>
</html>
