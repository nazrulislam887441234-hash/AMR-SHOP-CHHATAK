<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shopping Cart - AMR SHOP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background: #f8fafc; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; }
        .cart-card { transition: all 0.3s ease; }
        .cart-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="pb-32">

    <nav class="glass-nav sticky top-0 z-50 px-4 py-4">
        <div class="max-w-2xl mx-auto flex items-center gap-4">
            <button onclick="history.back()" class="p-2 bg-slate-100 rounded-xl">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" /></svg>
            </button>
            <h1 class="text-xl font-bold text-slate-800">শপিং কার্ট</h1>
        </div>
    </nav>

    <div class="max-w-2xl mx-auto p-4 space-y-4">
        <div id="cart-container" class="space-y-4">
            <div class="flex flex-col items-center justify-center py-20 text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4 opacity-20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
                <p>আপনার কার্ট বর্তমানে খালি আছে</p>
            </div>
        </div>

        <div id="summary-section" class="hidden bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 space-y-4">
            <div class="flex justify-between items-center text-slate-600">
                <span>মোট পণ্য:</span>
                <span id="total-qty" class="font-bold text-slate-800">০টি</span>
            </div>
            <div class="flex justify-between items-center text-xl font-black text-blue-600">
                <span>সর্বমোট দাম:</span>
                <span id="total-price">৳০</span>
            </div>
        </div>
    </div>

    <div id="bottom-bar" class="hidden fixed bottom-0 left-0 right-0 p-4 bg-white/80 backdrop-blur-lg border-t border-slate-100 z-50">
        <div class="max-w-2xl mx-auto">
            <button onclick="location.href='checkout.html'" class="w-full py-4 bg-blue-600 text-white font-bold rounded-2xl shadow-xl shadow-blue-100 active:scale-95 transition-all">
                চেকআউট পেজে যান
            </button>
        </div>
    </div>

    <script>
        function loadCart() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const container = document.getElementById('cart-container');
            const summary = document.getElementById('summary-section');
            const bottomBar = document.getElementById('bottom-bar');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20 text-slate-400">
                        <div class="p-6 bg-slate-50 rounded-full mb-4">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
                        </div>
                        <p class="text-lg font-bold text-slate-500">আপনার কার্ট খালি!</p>
                        <button onclick="location.href='index.html'" class="mt-4 text-blue-600 font-bold">কেনাকাটা চালিয়ে যান</button>
                    </div>`;
                summary.classList.add('hidden');
                bottomBar.classList.add('hidden');
                return;
            }

            summary.classList.remove('hidden');
            bottomBar.classList.remove('hidden');
            container.innerHTML = '';
            
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price;
                container.innerHTML += `
                    <div class="cart-card bg-white p-4 rounded-3xl border border-slate-100 shadow-sm flex gap-4 items-center relative">
                        <img src="${item.image}" class="w-20 h-20 object-cover rounded-2xl bg-slate-50">
                        
                        <div class="flex-1">
                            <h3 class="font-bold text-slate-800 text-sm leading-tight mb-1">${item.name}</h3>
                            <div class="flex gap-2 mb-2">
                                ${item.color ? `<span class="text-[10px] bg-slate-100 px-2 py-0.5 rounded-full text-slate-500">কালার: ${item.color}</span>` : ''}
                                ${item.size ? `<span class="text-[10px] bg-slate-100 px-2 py-0.5 rounded-full text-slate-500">সাইজ: ${item.size}</span>` : ''}
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="font-black text-blue-600">৳${item.price}</span>
                                <button onclick="location.href='product.html?id=${item.id}'" class="text-[12px] font-bold text-blue-500 border border-blue-100 px-3 py-1.5 rounded-xl hover:bg-blue-50 transition-colors">
                                    পণ্য দেখুন
                                </button>
                            </div>
                        </div>

                        <button onclick="removeItem(${index})" class="absolute -top-2 -right-2 bg-red-50 text-red-500 p-1.5 rounded-full border border-red-100 shadow-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                        </button>
                    </div>
                `;
            });

            document.getElementById('total-qty').innerText = `${cart.length}টি`;
            document.getElementById('total-price').innerText = `৳${total}`;
        }

        window.removeItem = (index) => {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        }

        // পেজ লোড হলে কার্ট ডাটা দেখাবে
        loadCart();
    </script>
</body>
</html>
